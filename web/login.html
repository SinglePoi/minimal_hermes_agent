<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Agent</title>
  <style>
    :root {
      --bg: #f7f2ea;
      --panel: rgba(255, 255, 255, 0.72);
      --line: rgba(95, 84, 68, 0.16);
      --text: #3d3529;
      --muted: #8a7c68;
      --accent: #a85c2f;
      --accent-strong: #8f4c24;
      --danger: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 500px at 15% -10%, rgba(232, 177, 130, 0.35), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(178, 148, 105, 0.28), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .card {
      width: min(380px, calc(100vw - 32px));
      padding: 34px 32px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(80, 66, 48, 0.14);
      backdrop-filter: blur(10px);
    }
    .logo { font-size: 34px; text-align: center; margin: 0 0 4px; }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .sub {
      margin: 0 0 22px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    input:focus { outline: 1px solid var(--accent); }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
      margin-top: 14px;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">🤖</p>
    <h1>Agent 控制台</h1>
    <p class="sub">登录后继续使用对话与审批功能</p>
    <form id="login-form" autocomplete="on">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">登 录</button>
      <p id="error" class="error" role="alert"></p>
    </form>
  </div>
  <script>
    "use strict";
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submit = document.getElementById("submit");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submit.disabled = true;
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          errorEl.textContent = data.error || ("登录失败（HTTP " + resp.status + "）");
          return;
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = "网络错误，请重试";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>

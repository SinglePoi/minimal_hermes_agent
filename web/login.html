<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap');
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.20);
      --text: #e2e8f0;
      --muted: #8ba3bd;
      --accent: #22c55e;
      --accent-strong: #16a34a;
      --cyan: #22d3ee;
      --danger: #f87171;
      --font-mono: "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1000px 560px at 15% -10%, rgba(34, 211, 238, 0.12), transparent 60%),
        radial-gradient(900px 540px at 100% 112%, rgba(34, 197, 94, 0.10), transparent 60%),
        radial-gradient(800px 500px at 50% 120%, rgba(139, 92, 246, 0.12), transparent 60%),
        linear-gradient(180deg, #020617 0%, #050b1a 50%, #020617 100%);
      color: var(--text);
      font-family: "Fira Sans", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 58%, rgba(2, 6, 23, 0.50) 100%),
        repeating-linear-gradient(0deg,
          rgba(148, 163, 184, 0.03) 0px,
          rgba(148, 163, 184, 0.03) 1px,
          transparent 1px,
          transparent 3px);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 85% 65% at 50% 112%, rgba(0, 0, 0, 0.85), transparent 72%);
      mask-image: radial-gradient(ellipse 85% 65% at 50% 112%, rgba(0, 0, 0, 0.85), transparent 72%);
    }
    .card {
      width: min(380px, calc(100vw - 32px));
      position: relative;
      z-index: 2;
      padding: 34px 32px;
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.86) 0%, rgba(8, 15, 32, 0.76) 100%);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 rgba(148, 163, 184, 0.10),
        0 18px 54px rgba(2, 6, 23, 0.65),
        0 0 36px rgba(34, 211, 238, 0.06);
      backdrop-filter: blur(14px) saturate(1.35);
      -webkit-backdrop-filter: blur(14px) saturate(1.35);
    }
    .logo {
      display: flex;
      justify-content: center;
      margin: 0 0 12px;
    }
    .logo svg {
      width: 46px;
      height: 46px;
      padding: 9px;
      border-radius: 13px;
      color: #022c12;
      background: linear-gradient(140deg, #34d399 0%, #22c55e 45%, #0ea5e9 100%);
      box-shadow:
        0 0 22px rgba(34, 197, 94, 0.45),
        0 0 48px rgba(14, 165, 233, 0.20);
    }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 0.12em;
      font-family: var(--font-mono);
      color: #f1f5f9;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.30);
    }
    h1::after {
      content: "▍";
      margin-left: 3px;
      color: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .sub {
      margin: 0 0 22px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 14px 0 6px;
      font-family: var(--font-mono);
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(3, 7, 18, 0.70);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-mono);
      caret-color: var(--accent);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      border-color: rgba(34, 197, 94, 0.55);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.14), 0 0 16px rgba(34, 197, 94, 0.10);
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 10px 0;
      border: none;
      border-radius: 9px;
      background: linear-gradient(145deg, #34d399 0%, #16a34a 100%);
      color: #022c12;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.32), 0 4px 14px rgba(2, 6, 23, 0.4);
      transition: box-shadow 0.15s ease, filter 0.15s ease;
    }
    button:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.45), 0 6px 18px rgba(2, 6, 23, 0.5);
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
      margin-top: 14px;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--danger);
      font-family: var(--font-mono);
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c.9 3.2 2.3 5.6 4.7 7.3 1.8 1.3 2.8 3.1 2.8 5.2 0 3.4-3.4 5.5-7.5 5.5S4.5 18.9 4.5 15.5c0-2.1 1-3.9 2.8-5.2C9.7 8.6 11.1 6.2 12 3z"/>
      </svg>
    </p>
    <h1>Agent 控制台</h1>
    <p class="sub">登录后继续使用对话与审批功能</p>
    <form id="login-form" autocomplete="on">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">登 录</button>
      <p id="error" class="error" role="alert"></p>
    </form>
  </div>
  <script>
    "use strict";
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submit = document.getElementById("submit");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submit.disabled = true;
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          errorEl.textContent = data.error || ("登录失败（HTTP " + resp.status + "）");
          return;
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = "网络错误，请重试";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
